<!DOCTYPE html>
  <html lang="ja">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1E2761">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="しまりす家計">
  <link rel="manifest" href="manifest.webmanifest">
  <title>しまりす家計ダッシュボード</title>
  <style>
    #kakei-root{
      --navy:#1E2761; --navy-d:#141A45; --gold:#FFC93C; --gold-d:#E8A800;
      --e1:#FF6B6B; --e1-l:#FFE3E3; --e2:#4D96FF; --e2-l:#E2EEFF;
      --e3:#FFB84D; --e3-l:#FFF1DD; --e4:#3FBF6F; --e4-l:#E4F7E6;
      --asset:#7C6BD6; --neg:#E5484D; --bg:#EEF0F6; --ink:#1B1F3B; --sub:#6B7089;
      font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",-apple-system,sans-serif;
    font-variant-numeric:tabular-nums; color:var(--ink); background:var(--bg);
    border-radius:16px; padding:0; max-width:720px; margin:0 auto; overflow:hidden;
}
  html,body{margin:0; padding:0; background:var(--bg);}
  body{padding:14px;}
  #kakei-root *{box-sizing:border-box;}
      .k-head{background:linear-gradient(135deg,var(--navy),var(--navy-d)); color:#fff; padding:20px 22px 16px;}
    .k-head h1{font-size:16px; font-weight:700; margin:0 0 2px; letter-spacing:.02em;}
  .k-head p{font-size:11px; color:#B9BEE0; margin:0;}
    .k-tabs{display:flex; gap:4px; padding:10px 14px 0;}
  .k-tab{flex:1; text-align:center; padding:9px 4px; font-size:12.5px; font-weight:700;
    color:#B9BEE0; background:transparent; border:none; border-radius:10px 10px 0 0; cursor:pointer;}
      .k-tab.active{color:var(--navy); background:var(--bg);}
  .k-body{padding:18px 18px 26px;}
  .k-card{background:#fff; border-radius:14px; padding:16px 18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(30,39,97,.06);}
      .k-hero{text-align:center; padding:22px 18px 18px;}
  .k-hero .k-label{font-size:12px; color:var(--sub); font-weight:700; letter-spacing:.04em;}
  .k-hero .k-amt{font-size:40px; font-weight:800; color:var(--navy); margin:6px 0 2px; letter-spacing:-.01em;}
  .k-hero .k-amt.neg{color:var(--neg);}
  .k-hero .k-sub{font-size:11.5px; color:var(--sub);}
  .k-allocbar{height:26px; border-radius:8px; overflow:hidden; display:flex; margin:10px 0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);}
  .k-allocbar span{height:100%;}
  .k-allocbar .free{background:linear-gradient(90deg,var(--gold),var(--gold-d)); box-shadow:0 0 10px rgba(255,201,60,.7) inset;}
  .k-legend{display:flex; flex-wrap:wrap; gap:8px 14px; font-size:10.5px; color:var(--sub); margin-top:8px;}
  .k-legend i{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:1px;}
  .k-chiprow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:14px;}
  .k-chip{background:var(--bg); border-radius:10px; padding:10px 8px; text-align:center;}
  .k-chip .t{font-size:10px; color:var(--sub); font-weight:700;}
  .k-chip .v{font-size:14.5px; font-weight:800; color:var(--navy); margin-top:3px;}
  .k-chip.paused{opacity:.4;}
  .k-spot{display:flex; align-items:center; justify-content:space-between; background:var(--asset); color:#fff;
      border-radius:12px; padding:12px 16px; margin-top:12px;}
  .k-spot .t{font-size:11.5px; opacity:.85;}
  .k-spot .v{font-size:18px; font-weight:800;}
  .k-enemy{border-radius:12px; margin-bottom:10px; overflow:hidden; border:1px solid rgba(0,0,0,.05);}
  .k-enemy summary{list-style:none; cursor:pointer; padding:11px 14px; display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:700;}
  .k-enemy summary::-webkit-details-marker{display:none;}
  .k-enemy summary .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px;}
  .k-enemy .items{padding:2px 14px 12px;}
  .k-item{display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-top:1px solid #F1F2F7;}
  .k-item label{font-size:12px; color:var(--ink);}
  .k-item input{width:100px; text-align:right; border:1px solid #DDE0EE; border-radius:7px; padding:5px 8px; font-size:12.5px; font-family:inherit;}
  .k-item input:focus{outline:2px solid var(--gold); border-color:transparent;}
  .k-income-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .k-income-row label{font-size:12.5px; font-weight:700; color:var(--navy);}
  .k-income-row input{width:120px; text-align:right; border:1px solid #DDE0EE; border-radius:8px; padding:7px 10px; font-size:13px; font-family:inherit;}
  .k-goalbox{background:linear-gradient(135deg,var(--navy),var(--navy-d)); color:#fff; border-radius:14px; padding:16px 18px; margin-bottom:14px;}
    .k-goalbox .t{font-size:11px; color:#B9BEE0; font-weight:700;}
    .k-goalbox .v{font-size:22px; font-weight:800; margin-top:4px; color:var(--gold);}
  .k-goalbox .s{font-size:11px; color:#B9BEE0; margin-top:2px;}
    .k-secttl{font-size:12.5px; font-weight:800; color:var(--navy); margin:2px 0 10px;}
  .k-assump{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-top:1px solid #F1F2F7;}
  .k-assump:first-child{border-top:none;}
  .k-assump label{font-size:12px; color:var(--ink); flex:1;}
  .k-assump .hint{font-size:10px; color:var(--sub); display:block; margin-top:1px;}
  .k-assump input[type=number]{width:96px; text-align:right; border:1px solid #DDE0EE; border-radius:7px; padding:5px 8px; font-size:12.5px; font-family:inherit;}
  .k-assump input[type=range]{width:120px; accent-color:var(--gold-d);}
  .k-assump .rangeval{width:44px; text-align:right; font-size:12.5px; font-weight:700; color:var(--navy);}
  .k-nav{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px;}
  .k-nav button{background:#fff; border:1px solid #DDE0EE; border-radius:8px; width:30px; height:30px; font-size:14px; cursor:pointer; color:var(--navy);}
      .k-nav .cur{font-size:13.5px; font-weight:800; color:var(--navy); min-width:90px; text-align:center;}
  .k-savebtn{width:100%; background:var(--navy); color:#fff; border:none; border-radius:10px; padding:11px; font-size:13px; font-weight:700; cursor:pointer; margin-top:6px;}
    .k-savebtn:active{transform:scale(.98);}
  .k-toast{position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--navy); color:#fff;
      padding:8px 16px; border-radius:20px; font-size:12px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:999;}
  .k-toast.show{opacity:1;}
  .k-note{font-size:10.5px; color:var(--sub); line-height:1.6; margin-top:2px;}
  .k-nextinvest .row{display:flex; justify-content:space-between; font-size:12px; padding:6px 0; border-top:1px solid #F1F2F7; color:var(--ink);}
  .k-nextinvest .row:first-child{border-top:none;}
  .k-nextinvest .row.total{font-weight:800; color:var(--navy); font-size:13.5px; border-top:2px solid var(--gold); margin-top:4px; padding-top:8px;}
  .k-walletrow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px;}
  .k-wallet{border-radius:10px; padding:10px 8px; text-align:center; color:#fff;}
    .k-wallet .t{font-size:10px; opacity:.85; font-weight:700;}
  .k-wallet .v{font-size:13.5px; font-weight:800; margin-top:3px;}
  .k-scenario{width:100%; border-collapse:collapse; font-size:12px;}
  .k-scenario th,.k-scenario td{padding:8px 6px; text-align:center; border-top:1px solid #F1F2F7;}
  .k-scenario th{color:var(--sub); font-weight:700; font-size:10.5px;}
  .k-scenario td.hi{color:var(--navy); font-weight:800;}
  .k-scenario tr.current td{background:var(--e3-l);}
  .k-databox textarea{width:100%; height:88px; font-size:11px; font-family:monospace; border:1px solid #DDE0EE; border-radius:8px; padding:8px; margin-top:8px;}
  .k-databox .k-savebtn.alt{background:var(--asset);}
  svg text{font-family:"Hiragino Sans",sans-serif;}
  /* ---- 資産タブ 追加スタイル ---- */
  .k-progwrap{margin-top:10px;}
  .k-progbar{height:22px; border-radius:8px; background:#E4E6F0; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);}
  .k-progbar .fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-d)); border-radius:8px 0 0 8px; transition:width .4s;}
  .k-progbar .fill.asset{background:linear-gradient(90deg,#9a8be0,var(--asset));}
  .k-progmeta{display:flex; justify-content:space-between; font-size:10.5px; color:var(--sub); margin-top:5px;}
  .k-gauge{margin-bottom:12px;}
  .k-gauge .g-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;}
  .k-gauge .g-lab{font-size:11.5px; font-weight:700; color:var(--ink);}
  .k-gauge .g-val{font-size:11px; color:var(--sub);}
  .k-gauge .g-val b{color:var(--navy); font-size:12.5px;}
  .k-gauge .g-track{height:16px; border-radius:6px; background:#E4E6F0; overflow:hidden; position:relative;}
  .k-gauge .g-fill{height:100%; border-radius:6px;}
  .k-gauge .g-fill.tsumitate{background:linear-gradient(90deg,#5fbf8a,var(--e4));}
  .k-gauge .g-fill.growth{background:linear-gradient(90deg,#6aa6ff,var(--e2));}
  .k-gauge .g-fill.lifetime{background:linear-gradient(90deg,var(--gold),var(--gold-d));}
  .k-gauge .g-fill.lifegrowth{background:linear-gradient(90deg,#9a8be0,var(--asset));}
  .k-gauge .g-fill.warn{background:linear-gradient(90deg,#ff9a6b,var(--e1))!important;}
  .k-snap-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .k-snap-f{display:flex; flex-direction:column; gap:3px;}
  .k-snap-f label{font-size:11px; font-weight:700; color:var(--sub);}
  .k-snap-f input{border:1px solid #DDE0EE; border-radius:8px; padding:7px 9px; font-size:13px; text-align:right; font-family:inherit;}
  .k-snap-f input:focus{outline:2px solid var(--gold); border-color:transparent;}
  .k-gainbox{display:flex; align-items:center; justify-content:space-between; border-radius:10px; padding:10px 14px; margin-top:12px; color:#fff;}
  .k-gainbox.plus{background:var(--e4);} .k-gainbox.minus{background:var(--neg);}
  .k-gainbox .t{font-size:11px; opacity:.9;} .k-gainbox .v{font-size:17px; font-weight:800;}
  .k-stress{width:100%; border-collapse:collapse; font-size:12px;}
  .k-stress th,.k-stress td{padding:9px 6px; text-align:center; border-top:1px solid #F1F2F7;}
  .k-stress th{color:var(--sub); font-weight:700; font-size:10.5px;}
  .k-stress td.drop{font-weight:800; color:var(--neg);}
  .k-stress td.total{font-weight:800; color:var(--navy);}
  .k-stress td.ok{color:var(--e4); font-weight:700;} .k-stress td.ng{color:var(--neg); font-weight:700;}
  .k-defmonths{background:var(--e2-l); border-radius:10px; padding:11px 14px; margin-top:12px;}
  .k-defmonths .big{font-size:20px; font-weight:800; color:var(--e2);}
  .k-defmonths .lab{font-size:11px; color:var(--sub);}
  .k-empty{text-align:center; color:var(--sub); font-size:11.5px; padding:14px 8px; line-height:1.7;}
  .k-empty b{color:var(--navy);}
  .k-pacegrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  .k-pacecell{background:var(--bg); border-radius:10px; padding:11px 10px; text-align:center;}
  .k-pacecell .t{font-size:10px; color:var(--sub); font-weight:700;}
  .k-pacecell .v{font-size:16px; font-weight:800; color:var(--navy); margin-top:3px;}
  .k-pacecell.good{background:var(--e4-l);} .k-pacecell.good .v{color:var(--e4);}
  .k-pacecell.bad{background:var(--e1-l);} .k-pacecell.bad .v{color:var(--neg);}
  .k-verdict{font-size:11.5px; line-height:1.7; margin-top:10px; padding:10px 12px; border-radius:10px;}
  .k-verdict.good{background:var(--e4-l); color:#1c7a44;}
  .k-verdict.bad{background:var(--e1-l); color:#b23238;}
  /* ---- 使うタブ 追加スタイル ---- */
  .k-budgethero{text-align:center; padding:20px 18px 16px;}
  .k-budgethero .lab{font-size:12px; color:var(--sub); font-weight:700;}
  .k-budgethero .amt{font-size:36px; font-weight:800; color:var(--e4); margin:6px 0 2px; letter-spacing:-.01em;}
  .k-budgethero .amt.low{color:var(--e3-l);} .k-budgethero .amt.over{color:var(--neg);}
  .k-budgethero .sub{font-size:11px; color:var(--sub);}
  .k-usedbar{height:14px; border-radius:7px; background:#E4E6F0; overflow:hidden; margin:12px 2px 4px;}
  .k-usedbar .fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-d)); border-radius:7px 0 0 7px;}
  .k-usedbar .fill.over{background:linear-gradient(90deg,#ff8a6b,var(--neg));}
  .k-check{border-top:1px solid #F1F2F7; padding:12px 2px; display:flex; gap:11px; align-items:flex-start; cursor:pointer;}
  .k-check:first-of-type{border-top:none;}
  .k-check input{width:22px; height:22px; margin:1px 0 0; accent-color:var(--navy); flex-shrink:0; cursor:pointer;}
  .k-check .c-body{flex:1;}
  .k-check .c-q{font-size:13px; font-weight:700; color:var(--ink); line-height:1.45;}
  .k-check .c-why{font-size:10.5px; color:var(--sub); line-height:1.55; margin-top:3px;}
  .k-check .c-why b{color:var(--asset);}
  .k-checkverdict{margin-top:14px; padding:13px 15px; border-radius:12px; font-size:12.5px; line-height:1.6; font-weight:700;}
  .k-checkverdict .score{font-size:11px; font-weight:800; opacity:.8; display:block; margin-bottom:3px;}
  .k-addrow{display:grid; grid-template-columns:1fr; gap:8px; margin-bottom:10px;}
  .k-addrow input,.k-addrow select{border:1px solid #DDE0EE; border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit; width:100%;}
  .k-addrow .two{display:grid; grid-template-columns:1.3fr 1fr; gap:8px;}
  .k-log-item{border-top:1px solid #F1F2F7; padding:11px 2px;}
  .k-log-item:first-child{border-top:none;}
  .k-log-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .k-log-name{font-size:13px; font-weight:700; color:var(--ink);}
  .k-log-amt{font-size:13px; font-weight:800; color:var(--navy); white-space:nowrap;}
  .k-log-meta{font-size:10.5px; color:var(--sub); margin-top:2px;}
  .k-log-tag{display:inline-block; background:var(--bg); border-radius:5px; padding:1px 7px; margin-right:6px; color:var(--sub); font-weight:700;}
  .k-stars{display:flex; gap:3px; margin-top:7px; align-items:center;}
  .k-stars .st{font-size:20px; cursor:pointer; color:#D6D9E8; line-height:1;}
  .k-stars .st.on{color:var(--gold-d);}
  .k-stars .rate-lab{font-size:10.5px; color:var(--sub); margin-left:6px; font-weight:700;}
  .k-log-del{background:none; border:none; color:var(--sub); font-size:11px; cursor:pointer; padding:2px 4px;}
  .k-catsum{display:flex; justify-content:space-between; align-items:center; padding:9px 2px; border-top:1px solid #F1F2F7; font-size:12px;}
  .k-catsum:first-child{border-top:none;}
  .k-catsum .cs-name{color:var(--ink); font-weight:700;}
  .k-catsum .cs-val{color:var(--navy); font-weight:800;}
  .k-catsum .cs-hit{color:var(--e4);} .k-catsum .cs-miss{color:var(--neg);}
  .k-cite{font-size:10px; color:var(--sub); line-height:1.6; margin-top:10px; padding-top:10px; border-top:1px solid #F1F2F7;}
  @media (max-width:420px){
    .k-hero .k-amt{font-size:32px;}
        .k-chiprow{grid-template-columns:1fr 1fr 1fr; gap:6px;}
}
</style>
  </head>
  <body>
  <div id="kakei-root">
    <div class="k-head">
      <h1>しまりす家計ダッシュボード</h1>
      <p id="k-headsub">マネープラン v5・月次エンジン連動</p>
    </div>
    <div class="k-tabs">
      <button class="k-tab active" data-tab="month">今月</button>
      <button class="k-tab" data-tab="asset">資産</button>
      <button class="k-tab" data-tab="spend">使う</button>
      <button class="k-tab" data-tab="year">年間</button>
      <button class="k-tab" data-tab="assump">前提</button>
    </div>
    <div class="k-body">
      <div id="tab-month"></div>
      <div id="tab-asset" style="display:none"></div>
      <div id="tab-spend" style="display:none"></div>
      <div id="tab-year" style="display:none"></div>
      <div id="tab-assump" style="display:none"></div>
    </div>
  </div>
  <div class="k-toast" id="k-toast">保存しました</div>

  <script>
  (function(){
    const ITEMS = [
{id:'housing', name:'住宅', enemy:1},
  {id:'utilities', name:'水道・光熱費', enemy:1},
  {id:'telecom', name:'通信費', enemy:1},
  {id:'subscription', name:'サブスク費', enemy:1},
  {id:'insurance', name:'保険', enemy:1},
  {id:'tax', name:'税・社会保障', enemy:1},
  {id:'education', name:'教養・教育', enemy:1},
  {id:'food', name:'食費', enemy:2},
  {id:'daily', name:'日用品', enemy:2},
  {id:'transport', name:'交通費', enemy:2},
  {id:'health', name:'健康・医療', enemy:2},
  {id:'cash_card', name:'現金・カード', enemy:2},
  {id:'gasoline', name:'ガソリン', enemy:2},
  {id:'annual_fee', name:'年会費・自動車税', enemy:3},
  {id:'car_insurance', name:'自動車保険（年一括）', enemy:3},
  {id:'car_other', name:'自動車（その他）', enemy:3},
  {id:'hobby', name:'趣味・娯楽', enemy:4},
  {id:'clothing', name:'衣服・美容', enemy:4},
  {id:'social', name:'交際費', enemy:4},
  {id:'special', name:'特別な支出', enemy:4},
  {id:'other', name:'その他', enemy:4},
  {id:'uncategorized', name:'未分類', enemy:4},
    ];
  const ENEMY_META = {
    1:{label:'敵1', kind:'毎月・固定', color:'var(--e1)', light:'var(--e1-l)'},
        2:{label:'敵2', kind:'毎月・変動', color:'var(--e2)', light:'var(--e2-l)'},
    3:{label:'敵3', kind:'不定期・固定', color:'var(--e3)', light:'var(--e3-l)'},
        4:{label:'敵4', kind:'不定期・変動', color:'var(--e4)', light:'var(--e4-l)'},
      };
  // 実データはこの中に含めていません（公開ソースのため）。
  // 前提タブの「データを読み込む」からJSONを一度だけインポートすれば localStorage に保存され、以後はこの端末に残ります。
  const DEFAULT_ASSUMPTIONS = {
        defenseTarget:0, defenseStart:0, investStart:0, travelStart:0,
              baseIncome:0, bonus:0, expNormal:0, expJul26:0,
              fixedInvest:0, fixedSave:0, fixedTravel:0, returnRate:0.0,
              tripYear:2028, tripMonth:6, tripAmount:0, saveAfterTarget:1, goalTotal:0,
              targetYear:2030, targetMonth:11, discretionaryBudget:0,
          };
  const SEED_ACTUALS = {};

  // ---- NISA枠（2024〜 新NISA・2026年時点）----
  const NISA = {
    annualTsumitate:1200000, annualGrowth:2400000, annualTotal:3600000,
    lifetimeTotal:18000000, lifetimeGrowth:12000000,
  };
  // 実残高スナップショット: { "2026-07": {defense, investValue, investPrincipal, travel} }
  const DEFAULT_SNAPSHOTS = {};
  // NISA使用状況: annual={ "2026":{tsumitate, growth} }, lifetimeUsed=生涯枠使用済(総), lifetimeGrowthUsed=うち成長枠
  const DEFAULT_NISA = { lifetimeUsed:0, lifetimeGrowthUsed:0, annual:{} };
  let snapshots = {};
  let nisa = JSON.parse(JSON.stringify(DEFAULT_NISA));
  // 買い物ログ: [{id, ym, name, amount, category, sat(1-5 or null), score(チェックリスト該当数 or null)}]
  let purchases = [];
  const SPEND_CATS = ['服・美容','ゲーム・娯楽','ガジェット','本・学び','その他モノ'];

  const fmt = n => Math.round(n).toLocaleString('ja-JP');
  const monthKey = (y,m) => `${y}-${String(m).padStart(2,'0')}`;

  let assumptions = Object.assign({}, DEFAULT_ASSUMPTIONS);

{

  function latestSnapshot(){
    let key=null;
    Object.keys(snapshots).forEach(k=>{ if(!key || k>key) key=k; });
    if(!key) return null;
    const [y,m] = key.split('-').map(Number);
    return Object.assign({key,y,m}, snapshots[key]);
  }

  function getMonthActual(y,m){ return actuals[monthKey(y,m)] || null; }
  function expTotal(actual){
    if(!actual) return 0;
    if(actual.expTotalManual && actual.expTotalManual>0) return actual.expTotalManual;
    return Object.values(actual.exp||{}).reduce((a,b)=>a+(b||0),0);
  }
  function enemySubtotal(actual, enemy, excludeHobbySocial){
        if (!actual) return 0;
    let s = 0;
    ITEMS.forEach(it=>{
            if (it.enemy!==enemy) return;
      if (excludeHobbySocial && (it.id==='hobby'||it.id==='social')) return;
      s += (actual.exp && actual.exp[it.id]) || 0;
  });
    return s;
}

  function simulate(overrideReturn, startOverride){
        let defense, invested, travel, y, m;
    if (startOverride){
      y = startOverride.y; m = startOverride.m;
      defense = startOverride.defense; invested = startOverride.invested; travel = startOverride.travel;
    } else {
      y = 2026; m = 7;
      defense = assumptions.defenseStart; invested = assumptions.investStart; travel = assumptions.travelStart;
    }
    const returnRate = (overrideReturn===undefined) ? assumptions.returnRate : overrideReturn;
    const mret = Math.pow(1+returnRate, 1/12) - 1;
    const trace = [];
    for (let i=0;i<120;i++){
      const isBonus = (m===6||m===12);
      const isJulPause = (y===2026 && m===7);
      const actual = getMonthActual(y,m);
      const income = actual ? actual.income : assumptions.baseIncome;
      const expense = actual ? expTotal(actual) : (isJulPause ? assumptions.expJul26 : assumptions.expNormal);
      const fixedInvest = assumptions.fixedInvest;
      const fixedSave = isJulPause ? 0 : assumptions.fixedSave;
      const fixedTravel = isJulPause ? 0 : assumptions.fixedTravel;
      const regFree = Math.max(0, income - expense - fixedInvest - fixedSave - fixedTravel);
      const defenseAtStart = defense;
      const spot = (defense < assumptions.defenseTarget) ? regFree*0.5 : regFree;
      const bonus = isBonus ? assumptions.bonus : 0;
      let bonus2def = 0;
      if (bonus>0 && defense < assumptions.defenseTarget) bonus2def = Math.min(bonus, assumptions.defenseTarget-defense);
      const bonus2inv = bonus - bonus2def;
      const noSaveAfter = (assumptions.saveAfterTarget===0 && defense>=assumptions.defenseTarget);
      const savToDef = noSaveAfter ? 0 : fixedSave;
      const savToInv = noSaveAfter ? fixedSave : 0;
      defense = defense + savToDef + bonus2def;
      const investAction = fixedInvest + spot + bonus2inv + savToInv; // 今月実行する投資アクションの総額
      invested = invested*(1+mret) + investAction;
      let tripAdd = 0;
      if (y===assumptions.tripYear && m===assumptions.tripMonth) tripAdd = assumptions.tripAmount;
      travel = travel + fixedTravel + tripAdd;
      const total = defense+invested+travel;
      trace.push({y,m,defense,invested,travel,total,free:regFree,spot,expense,income,
                isActual:!!actual, defenseAtStart, investAction, bonus, bonus2def, bonus2inv});
      if (m===12){m=1;y+=1;} else m+=1;
    }
    return trace;
    }
  function findGoal(trace){
    for (let i=0;i<trace.length;i++) if (trace[i].total >= assumptions.goalTotal) return {idx:i, ...trace[i]};
    return null;
}
  function findGoalAt(rate){
    return findGoal(simulate(rate));
}

  // 実残高スナップショットがあればそこを起点に、無ければ前提から投影
  function anchoredProjection(rate){
    const snap = latestSnapshot();
    if (snap){
      return simulate(rate, {y:snap.y, m:snap.m,
        defense:snap.defense||0, invested:snap.investValue||0, travel:snap.travel||0});
    }
    return simulate(rate);
  }
  // 「今の総資産」= 直近スナップショットの合計。無ければ投影上の現在月。
  function currentTotal(){
    const snap = latestSnapshot();
    if (snap) return (snap.defense||0)+(snap.investValue||0)+(snap.travel||0);
    const tr = simulate();
    for (const r of tr){ if (r.y===curYear && r.m===curMonth) return r.total; }
    return tr[0] ? tr[0].total : 0;
  }
  // 目標期日までに、現状資産＋毎月PMT積立でgoalに届く必要月額（年率returnRate想定）
  function requiredMonthly(){
    const snap = latestSnapshot();
    const startY = snap ? snap.y : curYear, startM = snap ? snap.m : curMonth;
    let n = (assumptions.targetYear - startY)*12 + (assumptions.targetMonth - startM);
    if (n < 1) n = 1;
    const cur = currentTotal();
    const goal = assumptions.goalTotal;
    const r = Math.pow(1+assumptions.returnRate, 1/12) - 1;
    const grown = cur * Math.pow(1+r, n);
    let pmt;
    if (r < 1e-9){ pmt = (goal - cur) / n; }
    else { pmt = (goal - grown) / ((Math.pow(1+r, n) - 1) / r); }
    return {pmt:Math.max(0, pmt), months:n, alreadyThere: grown >= goal};
  }

  // ---------------- 資産タブ ----------------
  function svgPlanVsActual(){
    const trace = simulate();
    const idxTarget = (assumptions.targetYear-2026)*12 + (assumptions.targetMonth-7);
    const snap = latestSnapshot();
    const snapIdx = snap ? (snap.y-2026)*12 + (snap.m-7) : 0;
    let end = Math.max(idxTarget, snapIdx+3, 23);
    end = Math.min(end, 71, trace.length-1);
    const W=660,H=200,padL=52,padR=14,padT=14,padB=24;
    const snapPts = Object.keys(snapshots).map(k=>{
      const [yy,mm]=k.split('-').map(Number);
      const s=snapshots[k];
      return {idx:(yy-2026)*12+(mm-7), total:(s.defense||0)+(s.investValue||0)+(s.travel||0)};
    }).filter(p=>p.idx>=0 && p.idx<=end);
    const projInRange = trace.slice(0,end+1).map(r=>r.total);
    const maxV = Math.max(assumptions.goalTotal*1.12, ...projInRange, ...snapPts.map(p=>p.total), 1);
    const xi = i => padL + (i/end)*(W-padL-padR);
    const yScale = v => padT + (1-Math.max(v,0)/maxV)*(H-padT-padB);
    const planPath = trace.slice(0,end+1).map((r,i)=>`${i===0?'M':'L'}${xi(i).toFixed(1)},${yScale(r.total).toFixed(1)}`).join(' ');
    const goalY = yScale(assumptions.goalTotal);
    // 実績点＋実績を結ぶ線
    let actualPath='', dots='';
    snapPts.sort((a,b)=>a.idx-b.idx).forEach((p,i)=>{
      actualPath += `${i===0?'M':'L'}${xi(p.idx).toFixed(1)},${yScale(p.total).toFixed(1)} `;
      dots += `<circle cx="${xi(p.idx).toFixed(1)}" cy="${yScale(p.total).toFixed(1)}" r="4" fill="var(--navy)" stroke="#fff" stroke-width="1.5"/>`;
    });
    // 年ラベル（7月起点に合わせて配置）
    let labels='';
    for(let yy=2026; yy<=2026+Math.ceil(end/12); yy++){
      const ix=(yy-2026)*12; if(ix<0||ix>end) continue;
      labels += `<text x="${xi(ix).toFixed(1)}" y="${H-7}" font-size="9" fill="var(--sub)" text-anchor="middle">${yy}</text>`;
    }
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
      <line x1="${padL}" y1="${goalY.toFixed(1)}" x2="${W-padR}" y2="${goalY.toFixed(1)}" stroke="var(--gold-d)" stroke-dasharray="4 4"/>
      <text x="${padL}" y="${(goalY-5).toFixed(1)}" font-size="9" fill="var(--gold-d)">目標 ¥${fmt(assumptions.goalTotal)}</text>
      <path d="${planPath}" fill="none" stroke="#C3C7DE" stroke-width="2.2" stroke-dasharray="5 3"/>
      ${actualPath?`<path d="${actualPath}" fill="none" stroke="var(--navy)" stroke-width="2.5"/>`:''}
      ${dots}${labels}
    </svg>
    <div class="k-legend">
      <span><i style="background:#C3C7DE"></i>当初計画（前提から投影）</span>
      <span><i style="background:var(--navy)"></i>実績スナップショット</span>
    </div>`;
  }

    document.getElementById('snap-principal').oninput = updateGainBox;

  // ---------------- 使うタブ ----------------
  const CHECK_ITEMS = [
    {q:'これは「経験」を生む買い物？', why:'モノでも、そこで過ごす時間や思い出になるか。<b>経験への支出は満足が長続きしやすい</b>（Van Boven & Gilovich 2003 / 原則①）。'},
    {q:'よく使う・長く遊ぶ？（使用あたりが安い）', why:'使う回数が多いほど1回あたりが下がり、<b>「新品の喜びが薄れる」快楽順応に強い</b>。7千円のゲームを70時間なら1時間100円。'},
    {q:'「大きな1回」より「小さな喜びの積み重ね」側？', why:'高額を一度どんとより、<b>小さな満足を何度も</b>の方が幸福度に効く（原則③）。'},
    {q:'買った後の現実を具体的に想像した？', why:'置き場所・手入れ・すぐ飽きないか等、<b>見落としがちな細部</b>まで想像したか（原則⑥）。'},
    {q:'使っている人のレビュー・声を見た？', why:'自分の予測より<b>他人の実体験の方が満足を当てる</b>。ある実験では他者情報が50%正確だった（原則⑦）。'},
    {q:'スペック比較にハマって本質を見失っていない？', why:'比較しすぎると<b>幸福に関係ない属性</b>に気を取られる。「自分がどう使うか」に立ち返る（原則⑥）。'},
  ];

  function renderSpend(){
    const el = document.getElementById('tab-spend');
    const now=new Date();
    let ry=now.getFullYear()<2026?2026:now.getFullYear();
    let rm=(ry===2026&&now.getMonth()+1<7)?7:now.getMonth()+1;
    const ym = `${ry}-${String(rm).padStart(2,'0')}`;
    const budget = assumptions.discretionaryBudget||0;
    const thisMonth = purchases.filter(p=>p.ym===ym);
    const used = thisMonth.reduce((s,p)=>s+(p.amount||0),0);
    const remain = budget - used;
    const usedPct = budget>0 ? Math.min(100, used/budget*100) : 0;
    const over = remain<0;

    // カテゴリ別・満足度サマリー（評価済みのみ）
    const rated = purchases.filter(p=>p.sat!=null);
    const catStats = {};
    rated.forEach(p=>{ (catStats[p.category]=catStats[p.category]||[]).push(p.sat); });
    let catSumHtml='';
    Object.keys(catStats).forEach(c=>{
      const arr=catStats[c]; const avg=arr.reduce((a,b)=>a+b,0)/arr.length;
      const cls = avg>=4?'cs-hit':(avg<=2.5?'cs-miss':'');
      const tag = avg>=4?'当たりやすい':(avg<=2.5?'外しやすい':'ふつう');
      catSumHtml += `<div class="k-catsum"><span class="cs-name">${c}</span>
        <span><span class="${cls}" style="font-size:11px;font-weight:700;margin-right:8px;">${tag}</span>
        <span class="cs-val">★${avg.toFixed(1)}</span> <span style="font-size:10px;color:var(--sub)">(${arr.length}件)</span></span></div>`;
    });

    // ログ一覧（新しい順）
    const sorted = purchases.slice().sort((a,b)=>b.id-a.id);
    let logHtml='';
    if (sorted.length===0){
      logHtml = `<div class="k-empty">まだ記録がありません。<br>服やゲームを買ったら<b>金額とカテゴリだけ</b>記録して、<b>2〜3週間後に満足度</b>をつけてみましょう。当たり/外れの傾向が見えてきます。</div>`;
    } else {
      sorted.slice(0,30).forEach(p=>{
        const stars=[1,2,3,4,5].map(n=>`<span class="st ${p.sat!=null&&n<=p.sat?'on':''}" data-star="${p.id}:${n}">★</span>`).join('');
        const rateLab = p.sat!=null ? `満足度 ${p.sat}/5` : '2〜3週間後に評価';
        logHtml += `<div class="k-log-item">
          <div class="k-log-top"><span class="k-log-name">${p.name||'（無題）'}</span><span class="k-log-amt">¥${fmt(p.amount||0)}</span></div>
          <div class="k-log-meta"><span class="k-log-tag">${p.category||'—'}</span>${p.ym}
            <button class="k-log-del" data-del="${p.id}">削除</button></div>
          <div class="k-stars">${stars}<span class="rate-lab">${rateLab}</span></div>
        </div>`;
      });
    }

    el.innerHTML = `
      <div class="k-card k-budgethero">
        <div class="lab">今月 罪悪感なく使える残り（${ry}年${rm}月）</div>
        <div class="amt ${over?'over':''}">¥${fmt(remain)}</div>
        <div class="sub">${budget>0
          ? `裁量予算 ¥${fmt(budget)} のうち ¥${fmt(used)} を使用${over?'（予算オーバー）':''}`
          : '下で「今月の裁量予算」を決めると、残りが出せます'}</div>
        ${budget>0?`<div class="k-usedbar"><div class="fill ${over?'over':''}" style="width:${usedPct}%"></div></div>`:''}
        <div class="k-income-row" style="margin-top:14px;justify-content:center;gap:10px;">
          <label>今月の裁量予算</label>
          <input type="number" id="k-budget-input" value="${budget||''}" placeholder="0" style="width:130px;">
        </div>
        <p class="k-note" style="text-align:left;">これは<b>投資・貯金・必須生活費を除いた後</b>の、自由に使ってよい上限。この枠の中なら投資を1円も遅らせません。<b>使うかどうかは月初に決めた枠内かで判断し、レジでは悩まない</b>——が狙いです。</p>
      </div>

      <div class="k-card">
        <div class="k-secttl">良い買い物チェック（服・ゲームで迷ったら）</div>
        <p class="k-note" style="margin-bottom:6px;">迷っている品を思い浮かべて、当てはまるものにチェック。多くつくほど「満足が続きやすい買い物」です。</p>
        <div id="k-checklist">
          ${CHECK_ITEMS.map((it,i)=>`
            <label class="k-check">
              <input type="checkbox" data-check="${i}">
              <span class="c-body"><span class="c-q">${it.q}</span><span class="c-why">${it.why}</span></span>
            </label>`).join('')}
        </div>
        <div class="k-checkverdict" id="k-checkverdict" style="background:var(--bg);color:var(--sub);">
          <span class="score">0 / ${CHECK_ITEMS.length}</span>品を思い浮かべてチェックしてみましょう。
        </div>
        <p class="k-note" style="margin-top:10px;">おまけ2つ：<b>今すぐでなく少し待てる？</b>（待つ間の“楽しみ”自体が幸福を増やす・原則⑤）／<b>延長保証など割高な保険を足していない？</b>（人は悪い結果にも慣れる・原則④）。</p>
        <p class="k-cite">出典：Dunn, Gilbert &amp; Wilson (2011) “If money doesn't make you happy, then you probably aren't spending it right,” <i>Journal of Consumer Psychology</i> 21(2), 115–125 の8原則、および Van Boven &amp; Gilovich (2003) の経験＞モノ研究に基づく。これは満足を予測しやすくするための目安で、正解を断定するものではありません。</p>
      </div>

      <div class="k-card">
        <div class="k-secttl">満足度ログ</div>
        <div class="k-addrow">
          <input type="text" id="k-buy-name" placeholder="買ったもの（例：ニットセーター）">
          <div class="two">
            <select id="k-buy-cat">${SPEND_CATS.map(c=>`<option>${c}</option>`).join('')}</select>
            <input type="number" id="k-buy-amt" placeholder="金額">
          </div>
        </div>
        <button class="k-savebtn" id="k-buy-add">記録する</button>
        <p class="k-note">まず金額とカテゴリだけでOK。星は使ってしばらく経ってから、正直につけましょう。</p>
        <div style="margin-top:14px;">${logHtml}</div>
      </div>

      ${catSumHtml?`<div class="k-card">
        <div class="k-secttl">カテゴリ別の“当たり率”（評価済み ${rated.length}件）</div>
        ${catSumHtml}
        <p class="k-note">満足度の平均です。★4以上＝あなたにとって“当たりやすい”カテゴリ、堂々と使ってOK。★2.5以下＝“外しやすい”ので慎重に。勘ではなく実績で配分を決められます。</p>
      </div>`:''}
    `;

    // チェックリスト（全体再描画せず判定だけ更新）
    let checked=0;
    const vEl = document.getElementById('k-checkverdict');
    function updateVerdict(){
      const n=CHECK_ITEMS.length;
      let bg,col,msg;
      if (checked>=5){ bg='var(--e4-l)'; col='#1c7a44'; msg='満足しやすい買い物の条件がそろっています。<b>自由枠の中なら、迷わずどうぞ。</b>'; }
      else if (checked>=3){ bg='var(--e3-l)'; col='#9a6a00'; msg='悪くない選択。<b>チェックの付かなかった項目</b>（特に「よく使う?」「買った後の現実」）をもう一度だけ考えてみて。'; }
      else { bg='var(--e1-l)'; col='#b23238'; msg='後悔しやすいパターンかも。<b>少し寝かせてから決める</b>のが安全です。それでも欲しければ、それは本物の欲しさ。'; }
      vEl.style.background=bg; vEl.style.color=col;
      vEl.innerHTML=`<span class="score">${checked} / ${n} 該当</span>${msg}`;
    }
    document.querySelectorAll('#k-checklist input[data-check]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        checked = document.querySelectorAll('#k-checklist input[data-check]:checked').length;
        updateVerdict();
      });
    });

    document.getElementById('k-budget-input').onchange = async (e)=>{
      assumptions.discretionaryBudget = Number(e.target.value)||0;
      await saveAssumptions();
      toast('裁量予算を保存しました');
      renderSpend(); renderAssump();
    };
    document.getElementById('k-buy-add').onclick = async ()=>{
      const name=document.getElementById('k-buy-name').value.trim();

      if (!name && amt===0){ toast('名前か金額を入れてください'); return; }
      purchases.push({id:Date.now(), ym, name, amount:amt, category:cat, sat:null, score:checked||null});
      await savePurchases();
      toast('記録しました');
      renderSpend();
    };
    el.querySelectorAll('[data-star]').forEach(s=>{
      s.onclick = async ()=>{
        const [id,n]=s.dataset.star.split(':').map(Number);
        const p=purchases.find(x=>x.id===id);
        if(p){ p.sat = (p.sat===n)?null:n; await savePurchases(); renderSpend(); }
      };
    });
    el.querySelectorAll('[data-del]').forEach(b=>{
      b.onclick = async ()=>{
        const id=Number(b.dataset.del);
        purchases = purchases.filter(x=>x.id!==id);
        await savePurchases(); renderSpend();
      };
    });
  }

  // ---------------- 年間タブ ----------------
  function svgBarChart(){
    const y = curYear;
    const monthsData = [];
    for (let m=1;m<=12;m++){
      const actual = getMonthActual(y,m);
      let diff;
      if (actual){
        const isJulPause = (y===2026&&m===7);
        const assetForm = assumptions.fixedInvest + (isJulPause?0:assumptions.fixedSave) + (isJulPause?0:assumptions.fixedTravel);
        diff = actual.income - expTotal(actual) - assetForm;
      } else {
        diff = null;
      }
      monthsData.push({m, diff});
    }
    const W=660,H=170,pad=26;
    const known = monthsData.filter(d=>d.diff!==null).map(d=>d.diff);
    const maxV = Math.max(50000, ...known.map(v=>Math.abs(v)));
    const barW = (W-pad*2)/12 - 6;
    const zeroY = H/2;
    let bars = '';
    monthsData.forEach((d,i)=>{
      const x = pad + i*((W-pad*2)/12) + 3;
      if (d.diff===null){
        bars += `<rect x="${x}" y="${zeroY-1}" width="${barW}" height="2" fill="#DADDEE"/>`;
      } else {
        const h = Math.abs(d.diff)/maxV*(H/2-20);
        const y0 = d.diff>=0 ? zeroY-h : zeroY;
        const color = d.diff>=0 ? 'var(--gold-d)' : 'var(--neg)';
        bars += `<rect x="${x}" y="${y0}" width="${barW}" height="${Math.max(h,2)}" rx="3" fill="${color}"/>`;
      }
      bars += `<text x="${x+barW/2}" y="${H-6}" font-size="9" fill="var(--sub)" text-anchor="middle">${d.m}月</text>`;
});
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
      <line x1="${pad}" y1="${zeroY}" x2="${W-pad}" y2="${zeroY}" stroke="#DADDEE"/>
      ${bars}
    </svg>`;
}

  function svgLineChart(trace, goal){
    const W=660,H=220,padL=54,padR=16,padT=16,padB=26;
    const years = [];
    for (let yy=2026; yy<=2035; yy++){
      let last = null;
      trace.forEach(r=>{ if (r.y===yy) last = r; });
      if (last) years.push({y:yy, total:last.total});
    }
    const maxV = Math.max(assumptions.goalTotal*1.15, ...years.map(d=>d.total));
    const x = i => padL + i*((W-padL-padR)/(years.length-1));
    const yScale = v => padT + (1-v/maxV)*(H-padT-padB);
    let path = years.map((d,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${yScale(d.total).toFixed(1)}`).join(' ');
    const goalY = yScale(assumptions.goalTotal);
    let dots = years.map((d,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${yScale(d.total).toFixed(1)}" r="3.5" fill="var(--navy)"/>`).join('');
          let labels = years.map((d,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="9" fill="var(--sub)" text-anchor="middle">${d.y}</text>`).join('');
                let goalMark = '';
    if (goal){
      const gi = (goal.y-2026) + (goal.m-1)/12;
      const gx = padL + gi*((W-padL-padR)/(years.length-1));
      const gy = yScale(goal.total);
      goalMark = `<circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="6" fill="var(--gold)" stroke="#fff" stroke-width="2"/>
                <text x="${gx.toFixed(1)}" y="${(gy-12).toFixed(1)}" font-size="10" font-weight="700" fill="var(--gold-d)" text-anchor="middle">${goal.y}/${goal.m}</text>`;
}
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
            <line x1="${padL}" y1="${goalY.toFixed(1)}" x2="${W-padR}" y2="${goalY.toFixed(1)}" stroke="var(--gold-d)" stroke-dasharray="4 4"/>
            <text x="${padL}" y="${(goalY-5).toFixed(1)}" font-size="9" fill="var(--gold-d)">目標 ¥${fmt(assumptions.goalTotal)}</text>
            <path d="${path}" fill="none" stroke="var(--navy)" stroke-width="2.5"/>
            ${dots}${goalMark}${labels}
          </svg>`;
                                                                     }

  function svgWalletChart(trace){
        const W=660,H=190,padL=54,padR=16,padT=16,padB=26;
    const years = [];
    for (let yy=2026; yy<=2035; yy++){
      let last = null;
      trace.forEach(r=>{ if (r.y===yy) last = r; });
      if (last) years.push(last);
    }
    const maxV = Math.max(...years.map(d=>Math.max(d.defense,d.invested,d.travel)));
    const x = i => padL + i*((W-padL-padR)/(years.length-1));
    const yScale = v => padT + (1-Math.max(v,0)/maxV)*(H-padT-padB);
    function linePath(key){
            return years.map((d,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${yScale(d[key]).toFixed(1)}`).join(' ');
                                                                         }
    let labels = years.map((d,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="9" fill="var(--sub)" text-anchor="middle">${d.y}</text>`).join('');
          return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
            <path d="${linePath('defense')}" fill="none" stroke="var(--e1)" stroke-width="2.5"/>
            <path d="${linePath('invested')}" fill="none" stroke="var(--asset)" stroke-width="2.5"/>
            <path d="${linePath('travel')}" fill="none" stroke="var(--e4)" stroke-width="2.5"/>
            ${labels}
          </svg>
          <div class="k-legend">
            <span><i style="background:var(--e1)"></i>防衛資金</span>
            <span><i style="background:var(--asset)"></i>投資</span>
            <span><i style="background:var(--e4)"></i>旅行積立</span>
          </div>`;
    }

  function renderYear(){
        const el = document.getElementById('tab-year');
    const trace = anchoredProjection();
    const goal = findGoal(trace);
    let latest = trace[0];
    for (const r of trace){ if (r.isActual) latest = r; }
    const anchoredGoalAt = r => findGoal(anchoredProjection(r));
    const g0 = anchoredGoalAt(0.0), g3 = anchoredGoalAt(0.03), g5 = anchoredGoalAt(0.05);
    function scenRow(label, rate, g){
            const isCurrent = Math.abs(rate - assumptions.returnRate) < 0.001;
      return `<tr class="${isCurrent?'current':''}">
                <td>${label}</td>
                <td class="hi">${g ? `${g.y}/${g.m}` : '未到達'}</td>
                <td>${g ? `${g.idx+1}ヶ月後` : '-'}</td>
              </tr>`;
    }
    el.innerHTML = `
            <div class="k-goalbox">
              <div class="t">目標到達予想</div>
              <div class="v">${goal ? `${goal.y}年${goal.m}月頃` : '10年以内未到達'}</div>
        <div class="s">${goal ? `起点から約${goal.idx+1}ヶ月後・運用リターン${(assumptions.returnRate*100).toFixed(1)}%想定` : ''}</div>
      </div>
      <div class="k-card">
        <div class="k-secttl">資産の内訳（財布分け・直近実績: ${latest.y}年${latest.m}月）</div>
        <div class="k-walletrow">
          <div class="k-wallet" style="background:var(--e1)"><div class="t">防衛資金</div><div class="v">¥${fmt(latest.defense)}</div></div>
          <div class="k-wallet" style="background:var(--asset)"><div class="t">投資</div><div class="v">¥${fmt(latest.invested)}</div></div>
          <div class="k-wallet" style="background:var(--e4)"><div class="t">旅行積立</div><div class="v">¥${fmt(latest.travel)}</div></div>
        </div>
        ${svgWalletChart(trace)}
      </div>
      <div class="k-card">
        <div class="k-secttl">運用リターン別シナリオ比較</div>
        <table class="k-scenario">
          <tr><th>前提</th><th>到達年月</th><th>経過月数</th></tr>
          ${scenRow('運用0%', 0.0, g0)}
          ${scenRow('運用3%', 0.03, g3)}
          ${scenRow('運用5%', 0.05, g5)}
        </table>
        <p class="k-note">ハイライトは「前提」タブで今設定している運用リターンです。</p>
      </div>
      <div class="k-card">
        <div class="k-secttl">${curYear}年の月次収支差額</div>
        ${svgBarChart()}
      </div>
      <div class="k-card">
        <div class="k-secttl">資産推移（年末スナップショット）</div>
        ${svgLineChart(trace, goal)}
      </div>
    `;
}

  // ---------------- 前提タブ ----------------
  const ASSUMP_FIELDS = [
{key:'returnRate', label:'運用リターン（年率、仮定）', type:'range', min:0, max:0.1, step:0.005, pct:true,
        hint:'ここを動かすと到達予想がすぐ再計算されます'},
  {key:'defenseTarget', label:'防衛資金目標', type:'number'},
{key:'defenseStart', label:'開始防衛資金残高', type:'number'},
{key:'investStart', label:'開始投資残高', type:'number'},
{key:'travelStart', label:'開始旅行積立残高', type:'number'},
{key:'baseIncome', label:'月間基本手取り（未入力月の想定）', type:'number'},
{key:'expNormal', label:'月間支出想定（未入力月の想定）', type:'number'},
{key:'bonus', label:'ボーナス（1回あたり・6月/12月）', type:'number'},
{key:'fixedInvest', label:'固定投資額/月', type:'number'},
{key:'fixedSave', label:'固定貯金額/月', type:'number'},
{key:'fixedTravel', label:'固定旅行積立額/月', type:'number'},
{key:'saveAfterTarget', label:'防衛資金達成後も貯金を継続', type:'toggle',
        hint:'OFFにすると達成後は貯金分も投資へ（効果は小さい）'},
{key:'tripYear', label:'大型旅行：発生年', type:'number'},
{key:'tripMonth', label:'大型旅行：発生月', type:'number'},
{key:'tripAmount', label:'大型旅行：取り崩し額', type:'number'},
{key:'goalTotal', label:'総資産目標（到達判定用）', type:'number'},
{key:'targetYear', label:'目標期日：年', type:'number', hint:'資産タブの「必要月額」の逆算に使用'},
{key:'targetMonth', label:'目標期日：月', type:'number'},
{key:'discretionaryBudget', label:'月の裁量予算（自由に使ってよい上限）', type:'number', hint:'「使う」タブの残り表示に使用。投資・貯金・必須生活費を除いた後の額'},
  ];
  function renderAssump(){
        const el = document.getElementById('tab-assump');
    el.innerHTML = `<div class="k-card"><div class="k-secttl">前提条件</div><div id="k-assump-list"></div></div>
            <p class="k-note">数値を変えると「年間」タブの到達予想が自動で再計算されます。実績を入力した月は、この前提に関係なく実績が優先されます。</p>
            <div class="k-card k-databox">
              <div class="k-secttl">データのバックアップ・読み込み</div>
              <p class="k-note">このアプリのデータはこの端末のブラウザ内だけに保存されます（アカウント同期なし）。機種変更や引っ越しの際は、下の「書き出す」でJSONをコピーし、新しい端末の「読み込む」に貼り付けてください。</p>
              <button class="k-savebtn" id="k-export-btn">現在のデータを書き出す（コピー）</button>
              <textarea id="k-import-area" placeholder="ここにJSONを貼り付けて「読み込む」を押してください"></textarea>
              <button class="k-savebtn alt" id="k-import-btn">読み込む</button>
            </div>`;
    const list = document.getElementById('k-assump-list');
    ASSUMP_FIELDS.forEach(f=>{
      const row = document.createElement('div');
      row.className = 'k-assump';
      if (f.type==='range'){
        row.innerHTML = `<label>${f.label}${f.hint?`<span class="hint">${f.hint}</span>`:''}</label>
          <input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${assumptions[f.key]}" data-key="${f.key}">
          <span class="rangeval">${(assumptions[f.key]*100).toFixed(1)}%</span>`;
        const range = row.querySelector('input');
        const val = row.querySelector('.rangeval');
        range.oninput = async ()=>{
          assumptions[f.key] = Number(range.value);
          val.textContent = (assumptions[f.key]*100).toFixed(1)+'%';
          await saveAssumptions();
          renderYear(); renderAsset(); renderSpend();
};
} else if (f.type==='toggle'){
        row.innerHTML = `<label>${f.label}${f.hint?`<span class="hint">${f.hint}</span>`:''}</label>
          <input type="checkbox" data-key="${f.key}" ${assumptions[f.key]?'checked':''} style="width:20px;height:20px;accent-color:var(--navy)">`;
        const chk = row.querySelector('input');
        chk.onchange = async ()=>{
          assumptions[f.key] = chk.checked ? 1 : 0;
          await saveAssumptions();
          renderYear(); renderAsset(); renderSpend();
};
} else {
        row.innerHTML = `<label>${f.label}${f.hint?`<span class="hint">${f.hint}</span>`:''}</label>
          <input type="number" value="${assumptions[f.key]}" data-key="${f.key}">`;
        const inp = row.querySelector('input');
        inp.onchange = async ()=>{
          assumptions[f.key] = Number(inp.value)||0;
          await saveAssumptions();
          renderYear(); renderAsset(); renderSpend();
};
}
      list.appendChild(row);
});

    document.getElementById('k-export-btn').onclick = async ()=>{
      const payload = JSON.stringify({assumptions, actuals, snapshots, nisa, purchases});
      try {
        await navigator.clipboard.writeText(payload);
        toast('コピーしました');
} catch(e){
        document.getElementById('k-import-area').value = payload;
        toast('コピーできなかったため下の欄に表示しました');
}
};
    document.getElementById('k-import-btn').onclick = async ()=>{
      const raw = document.getElementById('k-import-area').value.trim();
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        if (data.assumptions) assumptions = Object.assign({}, DEFAULT_ASSUMPTIONS, data.assumptions);
        if (data.actuals) actuals = Object.assign({}, actuals, data.actuals);
        if (data.snapshots) snapshots = Object.assign({}, snapshots, data.snapshots);
        if (data.nisa) nisa = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_NISA)), data.nisa);
        if (data.purchases) purchases = data.purchases || [];
        await saveAssumptions();
        await saveActuals();
        await saveSnapshots();
        await saveNisa();
        await savePurchases();
        toast('読み込みました');
        renderMonth(); renderAsset(); renderSpend(); renderYear(); renderAssump();
} catch(e){
        toast('JSONの形式が正しくありません');
}
};
}

  // ---------------- タブ切替 ----------------
  document.querySelectorAll('.k-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.k-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      ['month','asset','spend','year','assump'].forEach(t=>{
        document.getElementById('tab-'+t).style.display = (t===btn.dataset.tab)?'block':'none';
});
});
});

  loadData().then(()=>{
    renderMonth();
    renderAsset();
    renderSpend();
    renderYear();
    renderAssump();
});
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
});
}
</script>
</body>
</html>
