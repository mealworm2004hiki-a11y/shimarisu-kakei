<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1E2761">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計">
<link rel="manifest" href="manifest.webmanifest">
<title>家計シンプル</title>
<style>
:root{--navy:#1E2761;--navy-d:#141A45;--gold:#FFC93C;--gold-d:#E8A800;--asset:#7C6BD6;--asset-l:#F3F1FC;--green:#2FBF6F;--green-d:#1c7a44;--green-l:#E4F7E6;--red:#E5484D;--red-l:#FFE3E3;--bg:#EEF0F6;--ink:#1B1F3B;--sub:#6B7089;--line:#E7E9F2;--navh:calc(58px + env(safe-area-inset-bottom));}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
html,body{margin:0;background:var(--bg);}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",-apple-system,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);overscroll-behavior-y:none;}
.in{max-width:560px;margin:0 auto;}
.head{background:linear-gradient(135deg,var(--navy),var(--navy-d));color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 0 15px;position:sticky;top:0;z-index:20;box-shadow:0 1px 10px rgba(20,26,69,.18);}
.head .in{padding:0 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
.head h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.01em;}
.head p{font-size:11px;color:#B9BEE0;margin:3px 0 0;}
.head .hbadge{font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap;}
.head .hbadge.ok{background:rgba(63,191,111,.22);color:#b6f0cd;}
.head .hbadge.warn{background:rgba(255,201,60,.2);color:#ffe08a;}
.body{padding:16px 0 calc(var(--navh) + 18px);min-height:70vh;}
.body .in{padding:0 14px;}
.tabview{animation:fade .24s ease;}
.tabview[hidden]{display:none;}
@keyframes fade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
@keyframes pop{0%{transform:scale(.96);}60%{transform:scale(1.02);}100%{transform:scale(1);}}
.card{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(30,39,97,.07);}
.hero{text-align:center;padding:24px 16px 18px;}
.hero .lab{font-size:12.5px;color:var(--sub);font-weight:700;}
.hero .amt{font-size:46px;font-weight:800;margin:4px 0 10px;letter-spacing:-.025em;line-height:1.02;}
.hero .amt.pos{color:var(--green);}
.hero .amt.neg{color:var(--red);}
.hero .sub{font-size:12px;color:var(--ink);line-height:1.6;background:var(--green-l);border-radius:12px;padding:11px 13px;text-align:left;}
.hero .sub.warn{background:#FFF4E0;color:#9a6a00;}
.hero .sub.plain{background:var(--bg);color:var(--sub);}
.hero .sub b{color:var(--green-d);}
.hero .sub.warn b{color:#9a6a00;}
.secttl{font-size:13px;font-weight:800;color:var(--navy);margin:0 0 12px;display:flex;align-items:center;gap:7px;}
.secttl .mn{margin-left:auto;font-size:11px;color:var(--sub);font-weight:700;}
.money{position:relative;}
.money .yen{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:15px;font-weight:700;pointer-events:none;}
.money input{width:100%;border:1.5px solid #DDE0EE;border-radius:11px;padding:13px 13px 13px 28px;font-size:16px;font-weight:700;font-family:inherit;color:var(--ink);text-align:right;background:#fff;transition:border-color .15s;}
.money input::placeholder{font-weight:400;color:#AEB2C7;}
.money input:focus{outline:none;border-color:var(--gold-d);box-shadow:0 0 0 3px rgba(255,201,60,.18);}
.stack{display:grid;gap:10px;}
.reco{background:var(--asset-l);border-radius:12px;padding:12px 14px;margin:12px 0 2px;font-size:12px;color:var(--ink);line-height:1.5;animation:pop .25s ease;}
.reco .big{font-weight:800;color:var(--asset);font-size:15px;}
.reco .split{display:flex;justify-content:space-between;gap:12px;margin-top:9px;font-weight:800;font-size:13px;}
.reco .split .inv{color:var(--asset);}
.reco .split .use{color:var(--green-d);}
.reco small{display:block;color:var(--sub);font-weight:400;font-size:10.5px;margin-top:7px;line-height:1.6;}
.subfield{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;}
.subfield label{font-size:12.5px;font-weight:700;color:var(--ink);}
.subfield label .h{display:block;font-size:10px;color:var(--sub);font-weight:400;margin-top:1px;}
.subfield .money{width:150px;flex:0 0 150px;}
.subfield .money input{font-size:15px;padding:11px 12px 11px 26px;}
.btn{background:var(--navy);color:#fff;border:none;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;user-select:none;transition:transform .08s,filter .12s;}
.btn:active{transform:scale(.97);filter:brightness(1.12);}
.btn.ghost{background:var(--bg);color:var(--navy);}
.btnfull{width:100%;padding:14px;margin-top:12px;}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-top:1px solid var(--line);font-size:13px;}
.item:first-child{border-top:none;}
.item .nm{color:var(--ink);font-weight:600;}
.item .am{font-weight:800;color:var(--navy);}
.item>span:last-child{flex-shrink:0;}
.item .am{white-space:nowrap;}
.item .del{background:none;border:none;color:#AEB2C7;font-size:11px;cursor:pointer;margin-left:12px;padding:4px;white-space:nowrap;}
.item .del:active{color:var(--red);}
.empty{text-align:center;color:var(--sub);font-size:12px;padding:18px 8px;line-height:1.9;}
.empty b{color:var(--navy);}
.note{font-size:10.5px;color:var(--sub);line-height:1.65;margin-top:10px;}
.goalbox{background:linear-gradient(135deg,var(--navy),var(--navy-d));color:#fff;border-radius:16px;padding:20px 18px;margin-bottom:14px;text-align:center;box-shadow:0 2px 10px rgba(20,26,69,.14);}
.goalbox .lab{font-size:12px;color:#B9BEE0;font-weight:700;}
.goalbox .big{font-size:40px;font-weight:800;color:var(--gold);margin:6px 0 2px;letter-spacing:-.025em;line-height:1.02;}
.goalbox .man{font-size:15px;color:#B9BEE0;margin-left:5px;font-weight:700;}
.goalbox .sub{font-size:11px;color:#B9BEE0;}
.ptable{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;margin-top:4px;}
.ptable th,.ptable td{padding:10px 6px;border-bottom:1px solid var(--line);}
.ptable th{font-size:10px;color:var(--sub);font-weight:700;text-align:right;}
.ptable th:first-child{text-align:left;}
.ptable td{text-align:right;font-weight:800;color:var(--asset);white-space:nowrap;}
.ptable td:first-child{text-align:left;color:var(--ink);font-size:12px;font-weight:700;}
.ptable td .yr{display:block;font-size:9.5px;color:var(--sub);font-weight:600;margin-top:1px;}
.ptable td.low{color:var(--sub);}
.ptable tbody tr:last-child td{border-bottom:none;}
.ptable tr.hl td{background:var(--asset-l);}
.ptable tr.hl td:first-child{border-left:3px solid var(--asset);padding-left:6px;}
.goalhit{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--green-l);color:var(--green-d);border-radius:12px;padding:13px 15px;font-weight:700;font-size:12.5px;}
.goalhit.miss{background:#FFF4E0;color:#9a6a00;}
.goalhit .v{font-size:15px;font-weight:800;white-space:nowrap;}
.legend{display:flex;gap:14px;font-size:10.5px;color:var(--sub);margin-top:8px;}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:4px;vertical-align:2px;}
.grp{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.05em;margin:20px 0 10px;}
.grp:first-child{margin-top:2px;}
.mfield{margin-bottom:14px;}
.mfield label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.mfield label .h{display:block;font-size:10.5px;color:var(--sub);font-weight:400;margin-top:1px;}
.mfield .manread{display:block;text-align:right;font-size:11px;color:var(--asset);font-weight:800;margin-top:5px;min-height:14px;}
.rowfield{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);}
.rowfield label{font-size:13px;font-weight:700;color:var(--ink);flex:1;}
.rowfield label .h{display:block;font-size:10.5px;color:var(--sub);font-weight:400;margin-top:1px;}
.intbox{display:flex;align-items:center;gap:6px;}
.intbox input{width:68px;text-align:center;border:1.5px solid #DDE0EE;border-radius:10px;padding:10px 6px;font-size:16px;font-weight:700;font-family:inherit;}
.intbox input:focus{outline:none;border-color:var(--gold-d);box-shadow:0 0 0 3px rgba(255,201,60,.18);}
.intbox .suf{font-size:12px;color:var(--sub);font-weight:700;}
.slide{display:flex;align-items:center;gap:10px;}
.slide input[type=range]{width:120px;accent-color:var(--gold-d);}
.slide .rv{width:48px;text-align:right;font-weight:800;color:var(--navy);font-size:14px;}
textarea{width:100%;height:84px;font-size:11px;font-family:ui-monospace,monospace;border:1.5px solid #DDE0EE;border-radius:11px;padding:10px;margin-top:10px;}
.bnav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:40;}
.bnav .in{display:flex;}
.bn{flex:1;border:none;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#9398B4;font-size:10.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:color .15s;}
.bn svg{width:25px;height:25px;}
.bn.active{color:var(--navy);}
.bn.active .dot{opacity:1;}
.bn .dot{width:5px;height:5px;border-radius:50%;background:var(--gold-d);opacity:0;margin-top:1px;transition:opacity .15s;}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 14px);transform:translateX(-50%) translateY(8px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;box-shadow:0 4px 16px rgba(20,26,69,.3);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<header class="head"><div class="in"><div><h1 id="h-title">使えるお金</h1><p id="h-sub">目標は確保、ここは使っていい残高</p></div><div class="hbadge" id="h-badge" style="display:none"></div></div></header>
<main class="body"><div class="in">
  <section id="tab-now" class="tabview"></section>
  <section id="tab-asset" class="tabview" hidden></section>
  <section id="tab-set" class="tabview" hidden></section>
</div></main>
<nav class="bnav"><div class="in">
  <button class="bn active" data-t="now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h12.5a1.5 1.5 0 0 1 1.5 1.5V8"/><path d="M3 8v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="13" r="1.3" fill="currentColor" stroke="none"/></svg><span>使う</span><span class="dot"></span></button>
  <button class="bn" data-t="asset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-4 3 3 5-7"/></svg><span>資産</span><span class="dot"></span></button>
  <button class="bn" data-t="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.2.61.76 1.05 1.42 1.09H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>設定</span><span class="dot"></span></button>
</div></nav>
<div class="toast" id="toast">保存しました</div>
<script>
(function(){
  "use strict";
  const DEF = {goalAmount:0, goalYears:5, investNow:0, cashNow:0, monthlyInvest:0, inheritAnnual:0, inheritTimes:0, returnRate:0.05};
  let setup = Object.assign({}, DEF);
  let months = {}; // { "2026-11": {income, expense, invest, extra} }
  let wants = [];   // [ {id, name, amount, bought} ]
  let activeTab = 'now';

  const now = new Date();
  const curY = now.getFullYear(), curM = now.getMonth()+1;
  const ym = curY + '-' + String(curM).padStart(2,'0');

  const fmt = n => Math.round(n||0).toLocaleString('ja-JP');
  const fmtMan = n => Math.abs(n) >= 10000 ? fmt(Math.round(n/10000)) + '万' : fmt(n);
  const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const digits = v => (v+'').replace(/[^\d]/g,'');
  const comma = v => { const d=digits(v); return d? Number(d).toLocaleString('ja-JP') : ''; };
  const vib = ()=>{ try{ navigator.vibrate && navigator.vibrate(9); }catch(e){} };
  function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600); }
  function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }
  function attachMoney(el){ el.addEventListener('input',()=>{ const c=comma(el.value); if(el.value!==c) el.value=c; }); }
  function animateValue(el, to){
    if(!el) return; const dur=520, t0=performance.now();
    (function tick(t){ const p=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-p,3); el.textContent='¥'+fmt(to*e); if(p<1) requestAnimationFrame(tick); else el.textContent='¥'+fmt(to); })(t0);
  }

  function load(){
    try{ const s=localStorage.getItem('kakei-setup'); if(s) setup=Object.assign({},DEF,JSON.parse(s)); }catch(e){}
    try{ const m=localStorage.getItem('kakei-months'); if(m) months=JSON.parse(m)||{}; }catch(e){}
    try{ const w=localStorage.getItem('kakei-wants'); if(w) wants=JSON.parse(w)||[]; }catch(e){}
  }
  const saveSetup  = ()=>{ try{ localStorage.setItem('kakei-setup', JSON.stringify(setup)); }catch(e){} };
  const saveMonths = ()=>{ try{ localStorage.setItem('kakei-months', JSON.stringify(months)); }catch(e){} };
  const saveWants  = ()=>{ try{ localStorage.setItem('kakei-wants', JSON.stringify(wants)); }catch(e){} };

  // ===== エンジン =====
  function projectYearly(rate, years, monthlyInv){
    const mret=Math.pow(1+rate,1/12)-1; let inv=setup.investNow, cash=setup.cashNow;
    const pts=[{k:0,total:inv+cash}];
    for(let i=1;i<=years*12;i++){ inv=inv*(1+mret)+monthlyInv; if(i%12===0 && (i/12)<=setup.inheritTimes) cash+=setup.inheritAnnual; if(i%12===0) pts.push({k:i/12,total:inv+cash}); }
    return pts;
  }
  const projectTotal=(rate,years,mi)=>{ const p=projectYearly(rate,years,mi); return p[p.length-1].total; };
  function requiredMonthly(){
    if(setup.goalAmount<=0 || setup.goalYears<=0) return 0;
    const f=m=>projectTotal(setup.returnRate, setup.goalYears, m);
    if(f(0)>=setup.goalAmount) return 0;
    let lo=0, hi=3000000; for(let i=0;i<44;i++){ const mid=(lo+hi)/2; if(f(mid)>=setup.goalAmount) hi=mid; else lo=mid; }
    return Math.ceil(hi/1000)*1000;
  }
  // 追加投資のおすすめは「目標に届かせるために今月必要な分」だけ（足りていれば0、残りは全部使っていい）
  function recoExtra(S){
    const gap=Math.max(0, requiredMonthly()-setup.monthlyInvest);
    if(S<=0) return {a:0,gap,fillGap:0,short:false};
    const a=Math.min(S,gap);
    return {a, gap, fillGap:a, short:(gap>S)};
  }
  function poolInfo(){
    const keys=Object.keys(months).sort(); let sum=0;
    keys.forEach(k=>{ const m=months[k]; sum+=(m.income||0)-(m.invest||0)-(m.extra||0)-(m.expense||0); });
    const bought=wants.filter(w=>w.bought).reduce((a,b)=>a+(b.amount||0),0);
    return {pool:sum-bought, avg:keys.length?sum/keys.length:0, keys};
  }
  const isConfigured = ()=> setup.goalAmount>0 || setup.monthlyInvest>0 || setup.investNow>0 || setup.cashNow>0;

  // ===== ヘッダー =====
  function setHeader(){
    const T={now:['使えるお金','目標は確保、ここは使っていい残高'],asset:['資産の見通し','このまま積み立てたら'],set:['設定','最初に一度だけ']};
    document.getElementById('h-title').textContent=T[activeTab][0];
    document.getElementById('h-sub').textContent=T[activeTab][1];
    const badge=document.getElementById('h-badge');
    if(activeTab!=='set' && setup.goalAmount>0 && isConfigured()){
      const onTrack=projectTotal(setup.returnRate,setup.goalYears,setup.monthlyInvest)>=setup.goalAmount;
      badge.style.display=''; badge.className='hbadge '+(onTrack?'ok':'warn');
      badge.textContent=onTrack?'目標 達成ペース':'目標 要見直し';
    } else badge.style.display='none';
  }

  // ===== 使えるお金タブ =====
  function renderNow(animate){
    const el=document.getElementById('tab-now');
    if(!isConfigured()){
      el.innerHTML=`<div class="card"><div class="empty" style="padding:28px 10px;">ようこそ 👋<br>まず目標と今の資産を登録しましょう。<br>そのあとは月末に <b>手取り・支出</b> を入れるだけです。</div><button class="btn btnfull" id="go-set">設定をはじめる</button></div>`;
      document.getElementById('go-set').onclick=()=>switchTab('set');
      setHeader(); return;
    }
    const {pool}=poolInfo();
    const onTrack=setup.goalAmount>0 ? projectTotal(setup.returnRate,setup.goalYears,setup.monthlyInvest)>=setup.goalAmount : null;
    const reqM=requiredMonthly();
    let push,pushCls;
    if(setup.goalAmount<=0){ push='毎月の余りを、使うための残高として繰り越しています。'; pushCls='plain'; }
    else if(onTrack){ push=`目標 ¥${fmtMan(setup.goalAmount)} は積立と遺産で達成できる見込みです。<b>この残高は気兼ねなく使ってOK</b> 👍`; pushCls=''; }
    else { push=`目標達成にあと少し。設定で積立を <b>月¥${fmt(Math.max(0,reqM-setup.monthlyInvest))} 増やす</b>と、ここを安心して使えます。`; pushCls='warn'; }
    const cm=months[ym]||{}; const closed=Object.keys(months).sort().reverse();

    el.innerHTML=`
      <div class="card hero">
        <div class="lab">使っていいお金（繰り越し）</div>
        <div class="amt ${pool<0?'neg':'pos'}" id="pool-amt">¥${fmt(pool)}</div>
        <div class="sub ${pushCls}">${push}</div>
      </div>
      <div class="card">
        <div class="secttl">月末に締める<span class="mn">${curY}年${curM}月</span></div>
        <div class="stack">
          <div class="money"><span class="yen">¥</span><input class="mc-in" id="mc-income" type="text" inputmode="numeric" placeholder="今月の手取り合計" value="${cm.income?comma(cm.income):''}"></div>
          <div class="money"><span class="yen">¥</span><input class="mc-in" id="mc-expense" type="text" inputmode="numeric" placeholder="支出合計（投資・貯金は除く）" value="${cm.expense!=null?comma(cm.expense):''}"></div>
        </div>
        <div class="reco" id="mc-reco" style="display:none"></div>
        <div class="subfield"><label>うち 追加投資<span class="h">おすすめを自動入力・変更可</span></label><div class="money"><span class="yen">¥</span><input id="mc-extra" type="text" inputmode="numeric" placeholder="0" value="${cm.extra?comma(cm.extra):''}"></div></div>
        <button class="btn btnfull" id="mc-close">${months[ym]?'この月を締め直す':'この月を締める'}</button>
        <div style="margin-top:14px;">${
          closed.length===0 ? '<div class="empty">まだ締めた月がありません。<br>手取りと支出を入れて「締める」と、余りが貯まります。</div>'
          : closed.map(k=>{ const m=months[k]; const s=(m.income||0)-(m.invest||0)-(m.extra||0)-(m.expense||0); const p=k.split('-');
              return `<div class="item"><span class="nm">${p[0]}年${+p[1]}月<span style="display:block;font-size:10px;color:var(--sub);font-weight:400;margin-top:2px;">手取り¥${fmt(m.income)}／支出¥${fmt(m.expense)}／積立¥${fmt(m.invest)}${m.extra?`／追加投資¥${fmt(m.extra)}`:''}</span></span><span style="display:flex;align-items:center;"><span class="am" style="color:${s>=0?'var(--green)':'var(--red)'}">${s>=0?'+':'−'}¥${fmt(Math.abs(s))}</span><button class="del" data-delm="${k}">削除</button></span></div>`;
            }).join('')
        }</div>
        <div class="note">支出合計は <b>投資・貯金を含めない</b> 生活・娯楽の合計。「手取り − 積立 − 追加投資 − 支出」の余りが上の残高に貯まります。<b>使わなかった分は消えずに繰り越され、実際には貯蓄（現金）として残ります</b>。目標は積立＋遺産で別に確保しているので、この繰り越しは"使ってもいいし、使わなければ資産として積み上がる"お金です。</div>
      </div>
      <div class="card">
        <div class="secttl">ほしいもの</div>
        <div class="stack">
          <input id="w-name" type="text" placeholder="買うか悩んでいるもの" style="border:1.5px solid #DDE0EE;border-radius:11px;padding:13px;font-size:15px;font-family:inherit;width:100%;">
          <div style="display:grid;grid-template-columns:1fr auto;gap:8px;"><div class="money"><span class="yen">¥</span><input id="w-amt" type="text" inputmode="numeric" placeholder="金額"></div><button class="btn" id="w-add">追加</button></div>
        </div>
        <div style="margin-top:12px;">${
          wants.length===0 ? '<div class="empty">買うか悩んでいるモノを入れると、<br><b>今の残高で買えるか</b>・あと何ヶ月で届くかが分かります。</div>'
          : wants.map(w=>wantRow(w,pool,poolInfo().avg)).join('')
        }</div>
        <div class="note">「買った」を押すと使っていいお金から引かれます。目標（積立と遺産で確保）には影響しません。買ったものは月末の支出合計には入れないでください。</div>
      </div>`;

    if(animate) animateValue(document.getElementById('pool-amt'), pool);

    const inc=document.getElementById('mc-income'), exp=document.getElementById('mc-expense'), extraEl=document.getElementById('mc-extra'), reco=document.getElementById('mc-reco');
    attachMoney(inc); attachMoney(exp); attachMoney(extraEl); attachMoney(document.getElementById('w-amt'));
    let extraTouched=(months[ym]&&months[ym].extra!=null);
    const mv=el2=>Number(digits(el2.value))||0;
    function upd(){
      const income=mv(inc), expense=mv(exp), S=income-setup.monthlyInvest-expense, r=recoExtra(S);
      if(!extraTouched) extraEl.value = r.a>0 ? comma(r.a) : '';
      const curExtra=mv(extraEl), useB=S-curExtra;
      if(!inc.value && !exp.value){ reco.style.display='none'; return; }
      let why;
      if(S<=0) why='今月は余りが出ていないので、追加投資は見送りでOK。';
      else if(r.gap>0 && r.short) why=`目標ペースにはこの余りだけでは少し足りません。今月は全額を追加投資に回すのがおすすめ。足りない分は⚙設定で積立を増やすと安心です。`;
      else if(r.gap>0) why=`目標に届かせるには、今月この額の追加投資がおすすめ。残りの¥${fmt(useB)}は気兼ねなく使ってOKです。`;
      else why='目標は今の積立で達成ペース。追加投資は不要で、余りはすべて使っていいお金です。';
      reco.style.display='block';
      reco.innerHTML=`今月の余り <span class="big">¥${fmt(S)}</span><div class="split"><span class="inv">↑ 追加投資 ¥${fmt(Math.max(0,curExtra))}</span><span class="use">使っていい ¥${fmt(useB)}</span></div><small>${why}</small>`;
    }
    inc.addEventListener('input',upd); exp.addEventListener('input',upd); extraEl.addEventListener('input',()=>{extraTouched=true;upd();}); upd();
    document.getElementById('mc-close').onclick=()=>{
      const income=mv(inc), expense=mv(exp), extra=Math.max(0,mv(extraEl));
      if(income===0 && expense===0){ toast('手取りか支出を入れてください'); return; }
      months[ym]={income,expense,invest:setup.monthlyInvest,extra}; saveMonths(); vib(); toast('締めました');
      renderNow(true); renderAsset(false); setHeader();
    };
    el.querySelectorAll('[data-delm]').forEach(b=>b.onclick=()=>{ const p=b.dataset.delm.split('-'); if(confirm(`${p[0]}年${+p[1]}月の記録を削除しますか？`)){ delete months[b.dataset.delm]; saveMonths(); keepScroll(()=>renderNow(false)); renderAsset(false); setHeader(); } });
    const addWant=()=>{ const name=document.getElementById('w-name').value.trim(), amt=mv(document.getElementById('w-amt')); if(amt<=0){ toast('金額を入れてください'); return; } wants.push({id:Date.now(),name,amount:amt,bought:false}); saveWants(); keepScroll(()=>renderNow(false)); };
    document.getElementById('w-add').onclick=addWant;
    document.getElementById('w-amt').addEventListener('keydown',e=>{ if(e.key==='Enter') addWant(); });
    el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{ const w=wants.find(x=>x.id===Number(b.dataset.buy)); if(w){ w.bought=!w.bought; saveWants(); vib(); keepScroll(()=>renderNow(false)); } });
    el.querySelectorAll('[data-delw]').forEach(b=>b.onclick=()=>{ wants=wants.filter(x=>x.id!==Number(b.dataset.delw)); saveWants(); keepScroll(()=>renderNow(false)); });
    setHeader();
  }
  function wantRow(w,pool,avg){
    if(w.bought) return `<div class="item"><span class="nm" style="color:var(--sub);text-decoration:line-through;">${esc(w.name)||'（無題）'}</span><span style="display:flex;align-items:center;"><span class="am" style="color:var(--sub)">¥${fmt(w.amount)}</span> <button class="btn ghost" style="padding:6px 12px;font-size:12px;margin-left:8px;" data-buy="${w.id}">戻す</button><button class="del" data-delw="${w.id}">削除</button></span></div>`;
    const canBuy=pool>=w.amount, short=w.amount-pool;
    const judge=canBuy?`<span style="color:var(--green-d);font-weight:700;">今すぐ買える（買っても残り¥${fmt(pool-w.amount)}）</span>`:(avg>0?`<span style="color:var(--sub);">あと¥${fmt(short)}・約${Math.max(1,Math.ceil(short/avg))}ヶ月で届く</span>`:`<span style="color:var(--sub);">あと¥${fmt(short)} 貯まれば買える</span>`);
    return `<div class="item" style="flex-direction:column;align-items:stretch;gap:8px;"><div style="display:flex;justify-content:space-between;"><span class="nm">${esc(w.name)||'（無題）'}</span><span class="am">¥${fmt(w.amount)}</span></div><div style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;">${judge}<span style="display:flex;align-items:center;"><button class="btn ${canBuy?'':'ghost'}" style="padding:6px 13px;font-size:12px;" data-buy="${w.id}">買った</button><button class="del" data-delw="${w.id}">削除</button></span></div></div>`;
  }

  // ===== 資産タブ =====
  function svgChart(years,rate){
    const W=520,H=190,padL=46,padR=12,padT=16,padB=24;
    const main=projectYearly(rate,years,setup.monthlyInvest), low=projectYearly(0.03,years,setup.monthlyInvest), goal=setup.goalAmount;
    const maxV=Math.max(goal*1.05, main[main.length-1].total, 1);
    const X=k=>padL+(k/years)*(W-padL-padR), Y=v=>padT+(1-Math.max(v,0)/maxV)*(H-padT-padB);
    const path=a=>a.map((d,i)=>`${i?'L':'M'}${X(d.k).toFixed(1)},${Y(d.total).toFixed(1)}`).join(' ');
    let labels=''; for(let k=0;k<=years;k++) labels+=`<text x="${X(k).toFixed(1)}" y="${H-7}" font-size="9" fill="#6B7089" text-anchor="middle">${curY+k}</text>`;
    const gy=Y(goal), dot=`<circle cx="${X(years).toFixed(1)}" cy="${Y(main[main.length-1].total).toFixed(1)}" r="4.5" fill="#7C6BD6" stroke="#fff" stroke-width="2"/>`;
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="margin-top:12px;overflow:visible;">
      ${goal>0&&gy>padT?`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}" stroke="#E8A800" stroke-dasharray="4 4"/><text x="${padL}" y="${(gy-4).toFixed(1)}" font-size="8.5" fill="#E8A800">目標 ¥${fmtMan(goal)}</text>`:''}
      <path d="${path(low)}" fill="none" stroke="#C3C7DE" stroke-width="2" stroke-dasharray="5 3"/>
      <path d="${path(main)}" fill="none" stroke="#7C6BD6" stroke-width="2.8"/>${dot}${labels}
    </svg><div class="legend"><span><i style="background:#7C6BD6"></i>想定利回り（オルカン）</span><span><i style="background:#C3C7DE"></i>控えめ 年3%</span></div>`;
  }
  function renderAsset(animate){
    const el=document.getElementById('tab-asset');
    if(!isConfigured()){ el.innerHTML='<div class="card"><div class="empty" style="padding:26px 10px;">まず <b>設定</b> で目標・今の資産・積立・遺産を入れてください。<br>そこから <b>何年後にいくらになるか</b> を予測します。</div></div>'; return; }
    const rate=setup.returnRate, rpct=(rate*100).toFixed(1).replace(/\.0$/,''), gy=Math.max(1,setup.goalYears||5);
    const main=projectYearly(rate,gy,setup.monthlyInvest), low=projectYearly(0.03,gy,setup.monthlyInvest);
    const goalV=main[main.length-1].total, onTrack=setup.goalAmount>0&&goalV>=setup.goalAmount, reqM=requiredMonthly();
    const hz=[]; for(let k=0;k<=gy;k++) hz.push(k);
    el.innerHTML=`
      <div class="goalbox">
        <div class="lab">${gy}年後（${curY+gy}年）の見込み</div>
        <div class="big" id="goal-amt">¥${fmt(goalV)}<span class="man">約${fmtMan(goalV)}円</span></div>
        <div class="sub">${setup.goalAmount>0?`目標 ¥${fmtMan(setup.goalAmount)}${onTrack?'　✓ 達成ペース':'　あと少し'}・`:''}オルカン想定 年${rpct}%</div>
      </div>
      ${setup.goalAmount>0?`<div class="card"><div class="secttl">目標までのペース</div>
        <div class="goalhit ${onTrack?'':'miss'}"><span>${gy}年で ¥${fmtMan(setup.goalAmount)} に${onTrack?'届く見込み':'届かせるには'}</span><span class="v">${onTrack?'OK 👍':`月¥${fmt(reqM)}`}</span></div>
        <div class="note">今の積立は月¥${fmt(setup.monthlyInvest)}。${onTrack?`必要額（月¥${fmt(reqM)}）を満たしています。余ったぶんは「使えるお金」で気兼ねなく使えます。`:`${gy}年で届かせるには月¥${fmt(reqM)}（あと¥${fmt(Math.max(0,reqM-setup.monthlyInvest))}）必要です。`} 遺産（毎年¥${fmt(setup.inheritAnnual)}×${setup.inheritTimes}回）も見込みに含めています。</div>
      </div>`:''}
      <div class="card"><div class="secttl">何年後に いくら？</div>
        <table class="ptable"><thead><tr><th>時点</th><th>想定 年${rpct}%</th><th>控えめ 年3%</th></tr></thead><tbody>
          ${hz.map(h=>`<tr class="${h===gy?'hl':''}"><td>${h===0?'今':h+'年後'}<span class="yr">${curY+h}年</span></td><td>¥${fmtMan(main[h].total)}</td><td class="low">¥${fmtMan(low[h].total)}</td></tr>`).join('')}
        </tbody></table>
        ${svgChart(gy,rate)}
        <div class="note">今の資産（投資¥${fmt(setup.investNow)}＋現金¥${fmt(setup.cashNow)}）に、毎月¥${fmt(setup.monthlyInvest)}の積立と遺産（毎年¥${fmt(setup.inheritAnnual)}×${setup.inheritTimes}回）を加えた試算。毎月の生活余り（＝使っていいお金）は含めていません。使わず繰り越した分は現金として積み上がるので、使わなければ実際はこの予測より前倒しで届きます。追加投資を続けた分や繰り越した貯蓄は、ときどき「今の投資額／今の現金」を実際の残高に更新すると予測に反映されます。将来を保証するものではありません。</div>
      </div>`;
    if(animate) animateValue(document.getElementById('goal-amt'), goalV);
  }

  // ===== 設定タブ =====
  const FIELDS=[
    {grp:'目標'},
    {k:'goalAmount',l:'目標の総資産',h:'いくら貯めたいか',money:true},
    {k:'goalYears',l:'目標まで何年',h:'今を1年目として',int:true,suf:'年'},
    {grp:'今の資産'},
    {k:'investNow',l:'今の投資額（評価額）',h:'証券口座の今の時価',money:true},
    {k:'cashNow',l:'今の現金・預金',h:'受け取り済みの遺産も含めて',money:true},
    {grp:'毎月の積立（目標の確保用）'},
    {k:'monthlyInvest',l:'投資の積立（月）',h:'オルカンなどに毎月積む額',money:true},
    {grp:'遺産など 臨時収入'},
    {k:'inheritAnnual',l:'1回あたりの金額',h:'毎年もらえる額',money:true},
    {k:'inheritTimes',l:'この先 あと何回',h:'受け取り済みを除く',int:true,suf:'回'},
    {grp:'利回り'},
    {k:'returnRate',l:'想定利回り（オルカン・年）',h:'初期値5%・全世界株式の長期想定',range:true,min:0,max:0.1,step:0.005},
  ];
  const manText = v => v>=10000 ? '= '+fmtMan(v)+'円' : (v>0?'= '+fmt(v)+'円':'');
  function renderSet(){
    const el=document.getElementById('tab-set');
    let rows='';
    FIELDS.forEach(f=>{
      if(f.grp){ rows+=`<div class="grp">${f.grp}</div>`; return; }
      if(f.money){ rows+=`<div class="mfield"><label>${f.l}<span class="h">${f.h}</span></label><div class="money"><span class="yen">¥</span><input type="text" inputmode="numeric" value="${setup[f.k]?comma(setup[f.k]):''}" placeholder="0" data-k="${f.k}" data-money="1"></div><span class="manread" data-man="${f.k}">${manText(setup[f.k])}</span></div>`; }
      else if(f.int){ rows+=`<div class="rowfield"><label>${f.l}<span class="h">${f.h}</span></label><div class="intbox"><input type="number" inputmode="numeric" value="${setup[f.k]||''}" placeholder="0" data-k="${f.k}"><span class="suf">${f.suf||''}</span></div></div>`; }
      else if(f.range){ rows+=`<div class="rowfield"><label>${f.l}<span class="h">${f.h}</span></label><div class="slide"><input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${setup[f.k]}" data-k="${f.k}"><span class="rv">${(setup[f.k]*100).toFixed(f.step<0.01?1:0)}%</span></div></div>`; }
    });
    el.innerHTML=`<div class="card"><div class="secttl">設定</div>${rows}<div class="note">入れた瞬間に保存され、各画面に反映されます。変わったときだけ直せばOK。</div></div>
      <div class="card"><div class="secttl">データのバックアップ</div>
        <div class="note" style="margin-top:0;margin-bottom:4px;">データはこの端末のブラウザ内だけに保存されます（同期なし）。機種変更の時は書き出してコピーし、新端末で読み込んでください。</div>
        <button class="btn btnfull" id="exp">現在のデータを書き出す（コピー）</button>
        <textarea id="imp" placeholder="ここにJSONを貼り付けて「読み込む」"></textarea>
        <button class="btn btnfull ghost" id="impbtn">読み込む</button>
      </div>`;
    el.querySelectorAll('input[data-k]').forEach(inp=>{
      const k=inp.dataset.k;
      if(inp.dataset.money){
        inp.addEventListener('input',()=>{ const c=comma(inp.value); if(inp.value!==c) inp.value=c; setup[k]=Number(digits(inp.value))||0; const mr=el.querySelector(`[data-man="${k}"]`); if(mr) mr.textContent=manText(setup[k]); saveSetup(); renderNow(false); renderAsset(false); setHeader(); });
      } else if(inp.type==='range'){
        inp.addEventListener('input',()=>{ setup[k]=Number(inp.value); inp.parentElement.querySelector('.rv').textContent=(setup[k]*100).toFixed(Number(inp.step)<0.01?1:0)+'%'; saveSetup(); renderNow(false); renderAsset(false); setHeader(); });
      } else {
        inp.addEventListener('change',()=>{ setup[k]=Number(inp.value)||0; saveSetup(); renderNow(false); renderAsset(false); setHeader(); });
      }
    });
    document.getElementById('exp').onclick=async()=>{ const p=JSON.stringify({setup,months,wants}); try{ await navigator.clipboard.writeText(p); toast('コピーしました'); }catch(e){ document.getElementById('imp').value=p; toast('下の欄に表示しました'); } };
    document.getElementById('impbtn').onclick=()=>{ const raw=document.getElementById('imp').value.trim(); if(!raw)return; try{ const d=JSON.parse(raw); if(d.setup) setup=Object.assign({},DEF,d.setup); if(d.months) months=d.months||{}; if(d.wants) wants=d.wants||[]; saveSetup();saveMonths();saveWants(); toast('読み込みました'); renderNow(true);renderAsset(true);renderSet();setHeader(); }catch(e){ toast('JSONの形式が正しくありません'); } };
  }

  // ===== タブ切替 =====
  function switchTab(t){
    if(t===activeTab){ window.scrollTo({top:0,behavior:'smooth'}); return; }
    activeTab=t;
    document.querySelectorAll('.bn').forEach(b=>b.classList.toggle('active', b.dataset.t===t));
    ['now','asset','set'].forEach(x=>{ const s=document.getElementById('tab-'+x); if(x===t){ s.hidden=false; s.style.animation='none'; void s.offsetWidth; s.style.animation=''; } else s.hidden=true; });
    window.scrollTo(0,0);
    if(t==='now') renderNow(true); else if(t==='asset') renderAsset(true);
    setHeader();
  }
  document.querySelectorAll('.bn').forEach(b=>b.addEventListener('click',()=>{ vib(); switchTab(b.dataset.t); }));

  load();
  renderNow(true); renderAsset(true); renderSet(); setHeader();
})();
</script>
<script>
  if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }
</script>
</body>
</html>
